<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎶 찐찐찐찐찐한 용액이야 🎶</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Jua','Malgun Gothic',sans-serif;
  background:linear-gradient(135deg,#fff1a8 0%,#ffd7b5 50%,#c8f1ff 100%);
  min-height:100vh;overflow:hidden;
}
#particles{position:fixed;inset:0;pointer-events:none;z-index:0;}
.particle{position:absolute;font-size:24px;pointer-events:none;animation:floatUp 2s ease-out forwards;}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-180px) scale(0.2);opacity:0;}}

#game{
  width:100vw;height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:8px;position:relative;z-index:1;
}

/* ── 타이틀 ── */
#titleArea{text-align:center;margin-bottom:16px;}
h1{
  font-size:clamp(32px,5.5vw,72px);color:#ff5722;font-weight:900;
  text-shadow:3px 3px 0 white;
  animation:titleWobble 2.5s ease-in-out infinite;
}
@keyframes titleWobble{0%,100%{transform:rotate(-1.5deg) scale(1);}50%{transform:rotate(1.5deg) scale(1.03);}}
.subtitle{font-size:clamp(20px,2.8vw,34px);font-weight:900;color:#1565c0;margin-top:8px;}

/* ── 모드 버튼 ── */
#modeSelect{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap;justify-content:center;}
.modeBtn{
  font-family:'Jua',sans-serif;
  font-size:clamp(20px,2.8vw,36px);font-weight:900;border:none;
  border-radius:999px;padding:18px 36px;
  color:white;cursor:pointer;transition:0.15s;
  box-shadow:0 6px 18px rgba(0,0,0,0.2);
}
.modeBtn:nth-child(1){background:linear-gradient(135deg,#ff7043,#e53935);}
.modeBtn:nth-child(2){background:linear-gradient(135deg,#1e88e5,#1565c0);}
.modeBtn:nth-child(3){background:linear-gradient(135deg,#43a047,#2e7d32);}
.modeBtn:hover{transform:scale(1.07) translateY(-2px);}
.modeBtn:active{transform:scale(0.95);}

/* ── 상단바 전체 컨테이너 ── */
#topbarWrapper{
  width:100%;max-width:1600px;
  display:none;
  flex-direction:column;
  align-items:center;
  gap:5px;
  margin-top:4px;
}
/* 홈 버튼 줄 (위) */
#topbarHomeRow{
  display:flex;align-items:center;justify-content:center;
  width:100%;
}
/* 점수+시간 한 줄 (아래) */
#topbarScores{
  display:flex;align-items:center;justify-content:center;
  gap:8px;width:100%;
}

/* ── 홈 버튼 ── */
#homeBtn{
  display:none;
  background:rgba(255,255,255,0.9);
  border:2px solid rgba(200,200,200,0.6);
  border-radius:999px;
  padding:7px 22px;
  font-family:'Jua',sans-serif;
  font-size:clamp(13px,1.4vw,15px);
  font-weight:900;
  color:#888;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  transition:0.15s;
  white-space:nowrap;
}
#homeBtn:hover{background:white;color:#e53935;transform:scale(1.07);}

/* 홈 확인 모달 */
#homeModal{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);
  display:none;align-items:center;justify-content:center;z-index:99999;
}
.homeBox{
  background:white;border-radius:24px;padding:32px 36px;
  text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.25);
  width:90%;max-width:380px;
}
.homeBox h2{font-size:24px;font-weight:900;color:#ff5722;margin-bottom:10px;}
.homeBox p{font-size:17px;color:#666;margin-bottom:22px;line-height:1.5;}
.homeBox .homeBtns{display:flex;gap:12px;justify-content:center;}
.homeBox .homeBtns button{
  flex:1;border:none;border-radius:999px;
  font-family:'Jua',sans-serif;font-size:18px;font-weight:900;
  padding:13px;cursor:pointer;transition:0.15s;
}
.homeBox .homeBtns .btnYes{background:linear-gradient(135deg,#e53935,#ff7043);color:white;}
.homeBox .homeBtns .btnNo{background:#eee;color:#555;}
.homeBox .homeBtns button:hover{transform:scale(1.05);}

/* ── 정보박스 (점수/타이머) ── */
.infoBox{
  background:white;border-radius:14px;
  padding:6px 14px;text-align:center;
  box-shadow:0 4px 14px rgba(0,0,0,0.1);
  flex:1;min-width:0;
}
.infoTitle{font-size:12px;font-weight:900;color:#888;line-height:1;}
.infoValue{font-size:clamp(22px,3vw,34px);font-weight:900;color:#333;line-height:1.1;}
.timerDanger{color:#e53935!important;animation:blink 0.35s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* ── 3인용 인라인 점수 (각 zone 위) ── */
.inlineScore{
  font-size:clamp(22px,2.8vw,36px);font-weight:900;
  color:#333;line-height:1;
  background:rgba(255,255,255,0.85);
  border-radius:12px;
  padding:3px 12px;
  margin-bottom:2px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  display:block;text-align:center;
}

/* ── 게임 배틀 영역 ── */
#battleArea{
  width:100%;max-width:1600px;flex:1;display:none;
  gap:8px;margin-top:4px;margin-bottom:4px;
  min-height:0;
}
.playerZone{
  flex:1;background:rgba(255,255,255,0.55);border-radius:20px;
  padding:8px;display:flex;flex-direction:column;
  align-items:center;position:relative;
  backdrop-filter:blur(6px);
  border:2px solid rgba(255,255,255,0.85);
  overflow:visible;min-width:0;
}
.playerTitle{font-size:clamp(22px,2.8vw,38px);font-weight:900;}
.playerMission{
  margin-top:6px;font-size:clamp(20px,2.6vw,36px);
  font-weight:900;color:#6a1b9a;text-align:center;min-height:34px;
  line-height:1.3;
}

/* ── 파워업 배너 ── */
#powerupBanner{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
  background:linear-gradient(135deg,#7c4dff,#e040fb);
  color:white;font-size:clamp(20px,2.5vw,34px);font-weight:900;
  padding:16px 36px;border-radius:20px;z-index:9995;
  box-shadow:0 8px 30px rgba(124,77,255,0.5);
  transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),opacity 0.3s;
  pointer-events:none;text-align:center;
}
#powerupBanner.show{transform:translate(-50%,-50%) scale(1);}

/* ── 카드 ── */
.cardWrap{
  width:100%;display:flex;gap:8px;
  margin-top:6px;justify-content:center;
  flex:1;align-items:center;min-height:0;
}
.card{
  flex:1;max-width:300px;
  height:clamp(260px,36vh,480px);
  background:white;border-radius:20px;position:relative;
  overflow:visible;cursor:pointer;
  border:6px solid white;
  box-shadow:0 8px 22px rgba(0,0,0,0.14);
  transition:transform 0.12s, box-shadow 0.12s;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
}
.card:hover{transform:scale(1.04);box-shadow:0 14px 32px rgba(0,0,0,0.2);}
.card:active{transform:scale(0.96);}
.cardLabel{
  position:absolute;top:6px;left:50%;transform:translateX(-50%);
  font-size:14px;font-weight:900;color:#aaa;z-index:2;
}
/* ── 비커 ── */
.beakerWrap{
  position:absolute;
  bottom:0; left:0; right:0;
  height:88%;
  display:flex;align-items:flex-end;justify-content:center;
}
.beaker{
  width:clamp(110px,15vw,185px);
  height:clamp(160px,24vh,280px);
  border:6px solid #555;border-top:none;
  border-radius:0 0 22px 22px;
  position:relative;
  overflow:visible;
  background:rgba(230,245,255,0.6);
  flex-shrink:0;
}
.water{
  position:absolute;bottom:0;left:0;right:0;
  border-radius:0 0 16px 16px;
  background:linear-gradient(to bottom,#81d4fa,#0288d1);
  transition:height 0.55s ease;
  overflow:hidden;
}
.bubble{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,0.55);
  animation:bubbleRise var(--dur,2s) ease-in infinite;
  bottom:0;
}
@keyframes bubbleRise{
  0%{transform:translateY(0) translateX(0);opacity:0.7;}
  100%{transform:translateY(-260px) translateX(var(--dx,0px));opacity:0;}
}
.object{
  position:absolute;
  left:50%;transform:translateX(-50%);
  font-size:clamp(40px,5.5vw,72px);
  line-height:1;
  transition:bottom 0.6s cubic-bezier(0.34,1.56,0.64,1);
  filter:drop-shadow(0 3px 6px rgba(0,0,0,0.22));
  white-space:nowrap;
  z-index:5;
}

/* ── 피드백 오버레이 ── */
.feedback-overlay{
  position:absolute;inset:0;border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:20;opacity:0;pointer-events:none;transition:opacity 0.12s;
}
.feedback-overlay.show{opacity:1;}
.feedback-mark{
  font-size:clamp(60px,10vw,120px);line-height:1;
  animation:popMark 0.32s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
}
.feedback-text{font-size:clamp(18px,2vw,30px);font-weight:900;color:white;margin-top:4px;}
@keyframes popMark{
  0%{transform:scale(0.2) rotate(-15deg);}
  70%{transform:scale(1.25) rotate(4deg);}
  100%{transform:scale(1) rotate(0);}
}

/* ── 플레이어별 콤보 배너 ── */
/* 2인 콤보: 고정 화면 위치 */
#comboP1_2p{
  position:fixed;top:16px;left:20px;
  font-size:clamp(18px,2.4vw,32px);font-weight:900;
  color:white;background:linear-gradient(135deg,#e53935,#ff6d00);
  padding:7px 18px;border-radius:999px;display:none;z-index:999;
  box-shadow:0 5px 16px rgba(229,57,53,0.5);
}
#comboP2_2p{
  position:fixed;top:16px;right:20px;
  font-size:clamp(18px,2.4vw,32px);font-weight:900;
  color:white;background:linear-gradient(135deg,#1565c0,#1e88e5);
  padding:7px 18px;border-radius:999px;display:none;z-index:999;
  box-shadow:0 5px 16px rgba(21,101,192,0.5);
}
/* 3인 콤보: 각 zone 상단에 뜨는 인라인 요소 */
.comboZone{
  position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  font-size:clamp(15px,1.8vw,26px);font-weight:900;
  color:white;
  padding:5px 16px;border-radius:999px;
  display:none;
  white-space:nowrap;
  box-shadow:0 3px 12px rgba(0,0,0,0.25);
  z-index:30;
  pointer-events:none;
}
#comboZone1{background:linear-gradient(135deg,#e53935,#ff6d00);}
#comboZone2{background:linear-gradient(135deg,#1565c0,#1e88e5);}
#comboZone3{background:linear-gradient(135deg,#43a047,#2e7d32);}
@keyframes comboPop{0%{transform:translateX(-50%) scale(0.5);}100%{transform:translateX(-50%) scale(1);}}
@keyframes comboPopFixed{0%{transform:scale(0.5);}100%{transform:scale(1);}}

.playerStreak{
  font-size:clamp(11px,1.3vw,16px);font-weight:900;color:#ff9800;
  margin-top:2px;min-height:16px;text-align:center;
}

/* ── 플로팅 점수 ── */
.floatingScore{
  position:fixed;font-size:26px;font-weight:900;
  pointer-events:none;z-index:9999;
  animation:floatScore 0.9s ease-out forwards;
}
@keyframes floatScore{
  0%{transform:translateY(0) scale(1);opacity:1;}
  100%{transform:translateY(-90px) scale(0.7);opacity:0;}
}

/* ── 결과 화면 ── */
#resultScreen{
  position:fixed;inset:0;background:rgba(255,255,255,0.97);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;overflow-y:auto;padding:20px;
}
#resultEmoji{font-size:80px;}
#resultTitle{font-size:clamp(32px,5vw,60px);font-weight:900;color:#ff9800;margin-top:6px;}
#finalScore{
  font-size:clamp(18px,2.5vw,36px);font-weight:900;color:#e53935;
  margin-top:12px;text-align:center;line-height:1.6;
}
#rankBadge{margin-top:12px;font-size:clamp(18px,2.2vw,32px);font-weight:900;border-radius:16px;padding:8px 30px;}
#leaderboard{
  margin-top:16px;width:100%;max-width:520px;
  background:white;border-radius:20px;
  box-shadow:0 6px 20px rgba(0,0,0,0.1);
  overflow:hidden;
}
#leaderboard h2{
  background:linear-gradient(135deg,#ff9800,#f44336);
  color:white;font-size:20px;font-weight:900;
  padding:12px 18px;text-align:center;
}
.lbRow{display:flex;align-items:center;padding:8px 16px;border-bottom:1px solid #f0f0f0;gap:10px;}
.lbRow:last-child{border-bottom:none;}
.lbRank{font-size:20px;font-weight:900;min-width:32px;color:#aaa;}
.lbRank.gold{color:#ffd700;}.lbRank.silver{color:#9e9e9e;}.lbRank.bronze{color:#cd7f32;}
.lbName{flex:1;font-size:16px;font-weight:900;}
.lbScore{font-size:18px;font-weight:900;color:#e53935;}
.lbModeTag{font-size:11px;font-weight:900;background:#eee;color:#777;border-radius:999px;padding:2px 7px;margin-left:4px;}
.lbNew{font-size:11px;font-weight:900;background:#e53935;color:white;border-radius:999px;padding:2px 7px;margin-left:4px;}

#restartBtn{
  margin-top:16px;border:none;border-radius:999px;
  background:linear-gradient(135deg,#43a047,#66bb6a);
  color:white;padding:16px 40px;font-size:clamp(18px,2.2vw,26px);
  font-weight:900;cursor:pointer;font-family:'Jua',sans-serif;
  box-shadow:0 6px 18px rgba(67,160,71,0.4);transition:0.15s;
}
#restartBtn:hover{transform:scale(1.05);}

/* ── 이름 입력 모달 ── */
#nameModal{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);
  display:none;align-items:center;justify-content:center;z-index:99999;
  flex-direction:column;gap:0;
}
.nameBox{
  background:white;border-radius:24px;padding:28px 32px 20px;
  text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.25);
  width:92%;max-width:560px;position:relative;
}
.nameBox h2{font-size:26px;font-weight:900;color:#ff5722;margin-bottom:14px;}
.nameInputRow{
  display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.nameInputLabel{
  font-size:18px;font-weight:900;white-space:nowrap;
  min-width:54px;
}
.nameBox input{
  flex:1;font-size:20px;font-family:'Jua',sans-serif;
  border:3px solid #ff9800;border-radius:12px;padding:10px 14px;
  text-align:center;outline:none;
  cursor:pointer;
}
.nameBox input:focus{border-color:#e53935;}
.nameBox .startBtn{
  margin-top:10px;width:100%;border:none;border-radius:999px;
  background:linear-gradient(135deg,#ff7043,#e53935);
  color:white;font-size:20px;font-weight:900;font-family:'Jua',sans-serif;
  padding:12px;cursor:pointer;
}

/* ── 가상 키보드 ── */
#vKeyboard{
  background:rgba(30,30,30,0.97);
  border-radius:0 0 20px 20px;
  padding:12px 10px 16px;
  width:92%;max-width:580px;
  box-shadow:0 12px 30px rgba(0,0,0,0.4);
  display:none;
}
.vkRow{display:flex;gap:5px;justify-content:center;margin-bottom:5px;}
.vkKey{
  font-family:'Jua',sans-serif;font-size:18px;font-weight:900;
  background:#555;color:white;border:none;border-radius:10px;
  padding:0;height:52px;flex:1;max-width:50px;
  cursor:pointer;transition:0.08s;
  box-shadow:0 4px 0 #222;
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
.vkKey:active{transform:translateY(3px);box-shadow:0 1px 0 #222;}
.vkKey .vk-shift-label{
  position:absolute;top:4px;right:5px;
  font-size:10px;font-weight:900;color:rgba(255,255,255,0.5);
  line-height:1;
}
/* shift 눌렸을 때 쌍자음 키 강조 */
#vKeyboard.shifted .vkKey[data-shift]{
  background:#7c3aed;
  box-shadow:0 4px 0 #4c1d95;
}
#vKeyboard.shifted .vkKey[data-shift] .vk-shift-label{
  color:#ffd700;
  font-size:12px;
}
#vKeyboard.shifted .vkKey[data-shift] .vk-main-label{
  opacity:0.4;font-size:14px;
}
.vkKey.wide{max-width:72px;font-size:14px;}
.vkKey.space{max-width:170px;font-size:13px;}
.vkKey.backspace{max-width:68px;font-size:15px;}
.vkKey.enter-btn{
  max-width:96px;font-size:13px;
  background:linear-gradient(135deg,#e53935,#ff7043);
  box-shadow:0 4px 0 #b71c1c;
}
.vkKey.shift-btn{
  max-width:68px;font-size:20px;
  background:#666;
  box-shadow:0 4px 0 #333;
}
.vkKey.shift-btn.active{
  background:#ffd700;color:#222;
  box-shadow:0 4px 0 #b8860b;
}
.vk-main-label{transition:0.1s;}

/* ── 깜짝 퀴즈 팝업 ── */
.quizPopup{
  position:absolute;inset:10px;
  background:linear-gradient(135deg,#1a1a2e,#16213e);
  border-radius:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:50;
  animation:quizIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes quizIn{0%{transform:scale(0) rotate(-8deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
.quizTitle{font-size:clamp(18px,2.5vw,32px);font-weight:900;color:#ffeb3b;text-align:center;}
.quizQ{margin-top:10px;font-size:clamp(16px,2.2vw,28px);font-weight:900;color:white;text-align:center;padding:0 14px;line-height:1.5;}
.quizBtns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px;width:92%;}
.quizBtn{
  font-size:clamp(18px,2.5vw,34px);font-weight:900;font-family:'Jua',sans-serif;
  padding:14px 8px;border:none;border-radius:14px;cursor:pointer;
  background:linear-gradient(135deg,#42a5f5,#1565c0);color:white;
  flex:1 1 calc(50% - 8px);min-width:80px;max-width:calc(50% - 6px);
  box-sizing:border-box;text-align:center;transition:0.15s;
}
.quizBtns.two .quizBtn{font-size:clamp(28px,4vw,52px);padding:18px 8px;}
.quizBtn:hover{transform:scale(1.06);}

/* ── 긴장감 pulse 링 ── */
.tensionRing{
  position:fixed;inset:0;border:8px solid rgba(255,23,68,0);
  pointer-events:none;z-index:9990;
  transition:border-color 0.3s;
}
.tensionRing.active{
  border-color:rgba(255,23,68,0.55);
  animation:ringPulse 0.6s ease-in-out infinite alternate;
}
@keyframes ringPulse{0%{border-color:rgba(255,23,68,0.2);}100%{border-color:rgba(255,23,68,0.7);}}

/* ── 1인 타이머바 ── */
#questionTimerBar{
  width:100%;height:7px;background:#eee;border-radius:999px;
  margin-top:4px;overflow:hidden;display:none;max-width:1600px;
}
#questionTimerFill{height:100%;border-radius:999px;background:linear-gradient(90deg,#43a047,#ff9800,#e53935);transition:width 0.1s linear;}
</style>
</head>
<body>

<div id="particles"></div>
<div class="tensionRing" id="tensionRing"></div>
<div id="powerupBanner">⚡ 파워업!</div>

<!-- 2인용 콤보 (화면 고정) -->
<div id="comboP1_2p">🔥 COMBO!</div>
<div id="comboP2_2p">🔥 COMBO!</div>

<!-- 홈 확인 모달 -->
<div id="homeModal">
  <div class="homeBox">
    <h2>🏠 홈으로 돌아가기</h2>
    <p>게임이 종료되고<br>점수가 저장되지 않아요.<br>정말 나가시겠어요?</p>
    <div class="homeBtns">
      <button class="btnYes" onclick="goHome()">나갈게요</button>
      <button class="btnNo" onclick="cancelHome()">계속 할게요</button>
    </div>
  </div>
</div>

/* ====================================================
   BGM – Web Audio
==================================================== */
let audioCtx;
let bgmNodes=[];
let bgmPlaying=false;

function getAudio(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function unlockAudio(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  const buf=audioCtx.createBuffer(1,1,22050);
  const src=audioCtx.createBufferSource();
  src.buffer=buf; src.connect(audioCtx.destination); src.start(0);
  document.removeEventListener('touchstart',unlockAudio);
  document.removeEventListener('touchend',unlockAudio);
  document.removeEventListener('click',unlockAudio);
}
document.addEventListener('touchstart',unlockAudio,{once:true});
document.addEventListener('touchend',unlockAudio,{once:true});
document.addEventListener('click',unlockAudio,{once:true});

function startBGM(){
  if(bgmPlaying) return;
  bgmPlaying=true;
  const ctx=getAudio();
  const melody=[
    [523,0.18],[587,0.18],[659,0.18],[698,0.18],
    [784,0.36],[698,0.18],[659,0.18],
    [587,0.18],[523,0.18],[494,0.18],[523,0.36],
    [659,0.18],[784,0.18],[880,0.36],[784,0.18],[698,0.18],
    [659,0.18],[587,0.18],[523,0.36],[0,0.18],
  ];
  const bass=[
    [262,0.72],[294,0.72],[330,0.72],[349,0.72],
    [294,0.72],[330,0.72],[262,0.72],[0,0.36],
  ];
  function scheduleLoop(startTime){
    if(!bgmPlaying) return;
    let t=startTime;
    melody.forEach(([freq,dur])=>{
      if(freq>0){
        const o=ctx.createOscillator(); const g=ctx.createGain();
        o.type='triangle'; o.frequency.value=freq;
        g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.07,t+0.02);
        g.gain.setValueAtTime(0.07,t+dur-0.04); g.gain.linearRampToValueAtTime(0.001,t+dur);
        o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur);
        bgmNodes.push(o,g);
      }
      t+=dur;
    });
    let tb=startTime;
    bass.forEach(([freq,dur])=>{
      if(freq>0){
        const o=ctx.createOscillator(); const g=ctx.createGain();
        o.type='sine'; o.frequency.value=freq;
        g.gain.setValueAtTime(0.001,tb); g.gain.linearRampToValueAtTime(0.04,tb+0.05);
        g.gain.setValueAtTime(0.04,tb+dur-0.08); g.gain.linearRampToValueAtTime(0.001,tb+dur);
        o.connect(g); g.connect(ctx.destination); o.start(tb); o.stop(tb+dur);
        bgmNodes.push(o,g);
      }
      tb+=dur;
    });
    const totalDur=melody.reduce((s,[,d])=>s+d,0);
    setTimeout(()=>scheduleLoop(ctx.currentTime+0.05),(totalDur-0.1)*1000);
  }
  scheduleLoop(ctx.currentTime+0.1);
}
function stopBGM(){
  bgmPlaying=false;
  bgmNodes.forEach(n=>{ try{n.stop&&n.stop();}catch(e){} });
  bgmNodes=[];
}
function playTone(freqs,times,vol,type='sine'){
  try{
    const ctx=getAudio();
    freqs.forEach((f,i)=>{
      const g=ctx.createGain(), o=ctx.createOscillator();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(vol,ctx.currentTime+times[i]);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+times[i]+0.22);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime+times[i]); o.stop(ctx.currentTime+times[i]+0.28);
    });
  }catch(e){}
}

function saveBoard(b){ localStorage.setItem('jjin_board_v2',JSON.stringify(b)); }
function addToBoard(name, score, modeTag){
  let b=getBoard();
  b.push({name, score, modeTag, date:new Date().toLocaleDateString('ko-KR')});
  b.sort((a,z)=>z.score-a.score);
  b=b.slice(0,10);
  saveBoard(b);
  return b;
}

}

/* ====================================================
   한글 조합 엔진
==================================================== */
// 초성 / 중성 / 종성 테이블
const HG_CHO  = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const HG_JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const HG_JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

// 종성 → 분리(초성으로 쓸 수 있는 자음, 나머지 남는 종성)
const JONG_SPLIT = {
  'ㄳ':['ㄱ','ㄴ'], 'ㄵ':['ㄴ','ㅈ'], 'ㄶ':['ㄴ','ㅎ'],
  'ㄺ':['ㄹ','ㄱ'], 'ㄻ':['ㄹ','ㅁ'], 'ㄼ':['ㄹ','ㅂ'],
  'ㄽ':['ㄹ','ㅅ'], 'ㄾ':['ㄹ','ㅌ'], 'ㄿ':['ㄹ','ㅍ'],
  'ㅀ':['ㄹ','ㅎ'], 'ㅄ':['ㅂ','ㅅ'],
};

// 종성 두 자음 합성 가능 여부
const JONG_COMBINE = {
  'ㄱ+ㅅ':'ㄳ','ㄴ+ㅈ':'ㄵ','ㄴ+ㅎ':'ㄶ',
  'ㄹ+ㄱ':'ㄺ','ㄹ+ㅁ':'ㄻ','ㄹ+ㅂ':'ㄼ',
  'ㄹ+ㅅ':'ㄽ','ㄹ+ㅌ':'ㄾ','ㄹ+ㅍ':'ㄿ',
  'ㄹ+ㅎ':'ㅀ','ㅂ+ㅅ':'ㅄ',
};

// 모음 조합 (ㅗ/ㅜ/ㅡ 계열)
const JUNG_COMBINE = {
  'ㅗ+ㅏ':'ㅘ','ㅗ+ㅐ':'ㅙ','ㅗ+ㅣ':'ㅚ',
  'ㅜ+ㅓ':'ㅝ','ㅜ+ㅔ':'ㅞ','ㅜ+ㅣ':'ㅟ',
  'ㅡ+ㅣ':'ㅢ',
};

function isCho(c)  { return HG_CHO.includes(c); }
function isJung(c) { return HG_JUNG.includes(c); }

function makeChar(cho, jung, jong){
  const ci=HG_CHO.indexOf(cho);
  const vi=HG_JUNG.indexOf(jung);
  const ji=HG_JONG.indexOf(jong);
  if(ci<0||vi<0||ji<0) return cho+jung+jong; // fallback
  return String.fromCharCode(0xAC00 + ci*21*28 + vi*28 + ji);
}

// 현재 조합 상태
// state: { cho, jung, jong, jongRaw } | null
let hgState = null;
let hgBase  = '';  // 확정된 앞부분 (target.value는 hgBase + 조합중글자)

function hgFlush(){
  if(!hgState) return;
  const ch = hgCompose(hgState);
  hgBase += ch;
  hgState = null;
  if(vkTarget) vkTarget.value = hgBase;
}

function hgCompose(s){
  if(!s) return '';
  if(!s.jung) return s.cho;                      // 자음만
  if(!s.jong) return makeChar(s.cho, s.jung,''); // 초+중
  return makeChar(s.cho, s.jung, s.jong);        // 초+중+종
}

function hgDisplay(){
  if(!vkTarget) return;
  vkTarget.value = hgBase + hgCompose(hgState);
}

/* ── Shift 토글 ── */
let vkShifted = false;
function vkToggleShift(){

  const kb = document.getElementById('vKeyboard');

function vkShiftKey(normal, shifted){

    // 한 번 입력 후 shift 자동 해제

function vkType(ch){
  if(!vkTarget) return;
  const maxLen = parseInt(vkTarget.maxLength)||8;

  // 숫자·공백 등 비한글
  if(!isCho(ch) && !isJung(ch)){
    hgFlush();
    if(hgBase.length < maxLen){
      hgBase += ch;
      vkTarget.value = hgBase;
    }
    return;
  }

  if(isJung(ch)){
    // ── 모음 입력 ──
    if(!hgState){
      // 이전 확정 글자 없이 모음만 → 그냥 추가
      if(hgBase.length < maxLen){
        hgBase += ch;
        vkTarget.value = hgBase;
      }
      return;
    }
    if(!hgState.jung){
      // 초성만 있는 상태 → 초+중 시작
      hgState.jung = ch;
      hgDisplay();
      return;
    }
    // 모음+모음 조합(ㅗ+ㅏ 등)
    const combo = JUNG_COMBINE[hgState.jung+'+'+ch];
    if(combo && !hgState.jong){
      hgState.jung = combo;
      hgDisplay();
      return;
    }
    if(!hgState.jong){
      // 초+중 완성 후 새 모음 → 확정하고 모음만
      hgFlush();
      if(hgBase.length < maxLen){
        hgBase += ch;
        vkTarget.value = hgBase;
      }
      return;
    }
    // 종성이 있는데 모음 → 종성을 새 초성으로 분리
    const jongRaw = hgState.jong;
    const split   = JONG_SPLIT[jongRaw];
    if(split){
      // 겹받침: 앞 자음은 종성으로 남기고, 뒷 자음이 새 초성
      hgState.jong = split[0];
      const newCho  = split[1];
      hgFlush();
      if(hgBase.length < maxLen){
        hgState = { cho:newCho, jung:ch, jong:'' };
        hgDisplay();
      }
    } else {
      // 단자음 종성: 통째로 새 초성
      hgState.jong = '';
      hgFlush();
      if(hgBase.length < maxLen){
        hgState = { cho:jongRaw, jung:ch, jong:'' };
        hgDisplay();
      }
    }
    return;
  }

  // ── 자음 입력 ──
  if(!hgState){
    // 아무것도 없으면 새 초성
    if(hgBase.length < maxLen){
      hgState = { cho:ch, jung:'', jong:'' };
      hgDisplay();
    }
    return;
  }
  if(!hgState.jung){
    // 초성만 있는 상태 → 확정 후 새 초성
    hgFlush();
    if(hgBase.length < maxLen){
      hgState = { cho:ch, jung:'', jong:'' };
      hgDisplay();
    }
    return;
  }
  if(!hgState.jong){
    // 초+중 → 종성 시도
    if(HG_JONG.includes(ch)){
      hgState.jong = ch;
      hgDisplay();
    } else {
      hgFlush();
      if(hgBase.length < maxLen){
        hgState = { cho:ch, jung:'', jong:'' };
        hgDisplay();
      }
    }
    return;
  }
  // 종성이 있는데 자음 → 겹받침 시도
  const combo2 = JONG_COMBINE[hgState.jong+'+'+ch];
  if(combo2 && HG_JONG.includes(combo2)){
    hgState.jong = combo2;
    hgDisplay();
  } else {
    // 겹받침 안 되면 확정 후 새 초성
    hgFlush();
    if(hgBase.length < maxLen){
      hgState = { cho:ch, jung:'', jong:'' };
      hgDisplay();
    }
  }
}

function vkBackspace(){
  if(!vkTarget) return;
  if(hgState){
    // 종성 겹받침 → 단자음 종성으로
    if(hgState.jong){
      const split = JONG_SPLIT[hgState.jong];
      hgState.jong = split ? split[0] : '';
      hgDisplay();
      return;
    }
    // 중성 조합모음 → 기본모음으로
    // (단순하게: 모음 하나 지우면 초성만 남김)
    if(hgState.jung){
      // ㅘ→ㅗ 같은 경우: 합성모음이면 앞 모음만 남기기
      const jungDecompose = {
        'ㅘ':'ㅗ','ㅙ':'ㅗ','ㅚ':'ㅗ',
        'ㅝ':'ㅜ','ㅞ':'ㅜ','ㅟ':'ㅜ','ㅢ':'ㅡ',
        'ㅒ':'ㅐ','ㅖ':'ㅔ',
      };
      const prev = jungDecompose[hgState.jung];
      if(prev){ hgState.jung = prev; }
      else { hgState.jung = ''; }
      hgDisplay();
      return;
    }
    // 초성만 → 전체 지우기
    hgState = null;
    vkTarget.value = hgBase;
    return;
  }
  // 확정된 글자 지우기
  if(hgBase.length > 0){
    hgBase = hgBase.slice(0,-1);
    vkTarget.value = hgBase;
  }
}

function startCountdown(m){
  mode=m;
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.78);display:flex;align-items:center;justify-content:center;z-index:9998;';
  document.body.appendChild(overlay);
  let count=3;
  const num=document.createElement('div');
  num.style.cssText='font-size:180px;font-weight:900;color:white;font-family:Jua,sans-serif;transition:transform 0.2s;';
  overlay.appendChild(num);
  function tick(){
    if(count>0){
      num.textContent=count;
      num.style.transform='scale(1.3)';
      setTimeout(()=>num.style.transform='scale(1)',150);
      sounds.tick(); count--;
      setTimeout(tick,1000);
    } else {
      num.textContent='시작!';
      num.style.fontSize='100px';
      sounds.bonus();
      setTimeout(()=>{overlay.remove(); startGame(m);},700);
    }
  }
  tick();
}

==================================================== */
function setObjectPosition(objEl, beakerEl, waterEl, floatClass){
  const bH=beakerEl.getBoundingClientRect().height||180;
  const waterPct=parseFloat(waterEl.style.height||'65')/100;
  const waterPx=bH*waterPct;
  const fs=parseFloat(getComputedStyle(objEl).fontSize)||44;
  const objH=fs*1.1;
  let bottomPx;
  if(floatClass==='floatHigh'){
    bottomPx=waterPx-objH*0.2;
  } else {
    bottomPx=objH*0.1;
  }
  objEl.style.bottom=bottomPx+'px';
}

/* ====================================================
   문제 생성
==================================================== */
function makeQuestion(player){
  const base=questionPool[Math.floor(Math.random()*questionPool.length)];
  const floatOnLeft=Math.random()<0.5;
  const q={
    emoji:base.emoji,
    mission:base.mission,
    findDense:base.findDense,
    leftClass:floatOnLeft?base.floatClass:base.sinkClass,
    rightClass:floatOnLeft?base.sinkClass:base.floatClass,
    answer:(base.findDense===floatOnLeft)?'left':'right',
    water:65
  };
  const roll=Math.random();
  let mult=1;
  if(roll<0.05) mult=3;
  else if(roll<0.20) mult=2;
  if(player===1) multiplier1=mult;
  else if(player===2) multiplier2=mult;
  else multiplier3=mult;

  if(player===1){q1=q; renderQ(1,q);}
  else if(player===2){q2=q; renderQ(2,q);}
  else{q3=q; renderQ(3,q);}
  startQuestionTimer();
}

function renderQ(player,q){
  const lEl=document.getElementById(`p${player}left`);
  const rEl=document.getElementById(`p${player}right`);
  if(!lEl||!rEl) return;
  lEl.innerText=q.emoji; rEl.innerText=q.emoji;
  lEl.className='object'; rEl.className='object';

  const lW=document.getElementById(`water${player}L`);
  const rW=document.getElementById(`water${player}R`);
  if(lW) lW.style.height=`${q.water}%`;
  if(rW) rW.style.height=`${q.water}%`;

  makeBubbles(`beaker${player}L`,4);
  makeBubbles(`beaker${player}R`,4);

  requestAnimationFrame(()=>{
    setTimeout(()=>{
      const bL=document.getElementById(`beaker${player}L`);
      const bR=document.getElementById(`beaker${player}R`);
      if(bL&&lW) setObjectPosition(lEl,bL,lW,q.leftClass);
      if(bR&&rW) setObjectPosition(rEl,bR,rW,q.rightClass);
    },60);
  });

  const mult=player===1?multiplier1:player===2?multiplier2:multiplier3;
  const multBadge=mult===3
    ?'<span style="background:#e53935;color:white;border-radius:8px;padding:2px 10px;margin-left:6px;font-size:0.8em;vertical-align:middle">🔥 3배!</span>'
    :mult===2
    ?'<span style="background:#ff9800;color:white;border-radius:8px;padding:2px 10px;margin-left:6px;font-size:0.8em;vertical-align:middle">⚡ 2배!</span>'
    :'';
  document.getElementById(`mission${player}`).innerHTML=q.mission+multBadge;
}

/* ====================================================
   선택
==================================================== */
function choose(player,side){
  const q=player===1?q1:player===2?q2:q3;
  if(!q) return;
  if(side===q.answer) correctAnswer(player);
  else wrongAnswer(player);
}

/* ====================================================
   피드백 오버레이
==================================================== */
const correctMsgs=['완벽해!','최고야!','정답!','천재?!','대박!','굿!'];
const wrongMsgs=['으악~','틀렸어!','다시!','아니야!','앗!'];

function showVisualFeedback(player,isCorrect){
  const ov=document.getElementById(`feedback${player}`);
  const mk=document.getElementById(`mark${player}`);
  const tx=document.getElementById(`text${player}`);
  if(!ov) return;
  if(isCorrect){
    ov.style.background='rgba(46,125,50,0.88)';
    mk.innerText='⭕';
    tx.innerText=correctMsgs[Math.floor(Math.random()*correctMsgs.length)];
  } else {
    ov.style.background='rgba(198,40,40,0.88)';
    mk.innerText='❌';
    tx.innerText=wrongMsgs[Math.floor(Math.random()*wrongMsgs.length)];
  }
  ov.classList.add('show');
  setTimeout(()=>ov.classList.remove('show'),500);
}

/* ====================================================
   파티클 & 플로팅 점수
==================================================== */
function spawnParticle(emoji,x,y){
  const p=document.createElement('div');
  p.className='particle'; p.innerText=emoji;
  p.style.left=(x-16)+'px'; p.style.top=(y-16)+'px';
  document.getElementById('particles').appendChild(p);
  setTimeout(()=>p.remove(),2100);
}
function showFloatingScore(txt,x,y,color){
  const el=document.createElement('div');
  el.className='floatingScore'; el.innerText=txt;
  el.style.cssText=`left:${x}px;top:${y}px;color:${color};`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),950);
}

/* ====================================================
   정답 처리
==================================================== */
function correctAnswer(player){
  sounds.correct();
  showVisualFeedback(player,true);
  if(player===1) totalCorrect1++;
  else if(player===2) totalCorrect2++;
  else totalCorrect3++;

  const ev=window.event||{};
  const ex=ev.clientX||window.innerWidth*(player===1?.2:player===2?.5:.8);
  const ey=ev.clientY||window.innerHeight/2;
  spawnParticle(['⭐','✨','💫','🌟'][Math.floor(Math.random()*4)],ex,ey);

  const elapsed=(Date.now()-questionStartTime)/1000;
  const speedBonus=Math.max(0,Math.round((1-Math.min(elapsed,QUESTION_TIME_LIMIT)/QUESTION_TIME_LIMIT)*200));
  let combo;
  if(player===1) combo=++combo1;
  else if(player===2) combo=++combo2;
  else combo=++combo3;
  const comboBonus=Math.min(combo-1,5)*20;
  const mult=player===1?multiplier1:player===2?multiplier2:multiplier3;
  const gained=Math.round((100+speedBonus+comboBonus)*mult);

  if(player===1){streak1++;maxStreak1=Math.max(maxStreak1,streak1);}
  else if(player===2){streak2++;maxStreak2=Math.max(maxStreak2,streak2);}
  else{streak3++;maxStreak3=Math.max(maxStreak3,streak3);}
  const myStreak=player===1?streak1:player===2?streak2:streak3;

  const sEl=document.getElementById(`streak${player}display`);
  if(sEl) sEl.innerText=myStreak>=2?`🔥 ${myStreak}연속 정답!`:'';

  const multTxt=mult>=3?' 🔥3배!!':mult>=2?' ⚡2배!':'';
  const label=`+${gained}${speedBonus>100?' ⚡빠름!':''}${multTxt}`;
  showFloatingScore(label,ex,ey,mult>=3?'#e53935':mult>=2?'#ff9800':'#2e7d32');

  if(mult>=2){
    spawnParticle(mult>=3?'🔥':'⚡',ex,ey);
    spawnParticle('💥',ex+50,ey-20);
  }

  if(player===1){score1+=gained; multiplier1=1;}
  else if(player===2){score2+=gained; multiplier2=1;}
  else{score3+=gained; multiplier3=1;}
  updateScore();

  if(combo>=2) showComboInZone(player,combo);
  if(myStreak>0&&myStreak%5===0){
    spawnParticle('🔥',ex,ey);
    spawnParticle('🎉',ex+60,ey-30);
  }

  makeQuestion(player);
}

function wrongAnswer(player){
  sounds.wrong();
  showVisualFeedback(player,false);
  if(player===1) totalWrong1++;
  else if(player===2) totalWrong2++;
  else totalWrong3++;

  const ev=window.event||{};
  spawnParticle('💧',ev.clientX||window.innerWidth/2,ev.clientY||window.innerHeight/2);

  const penalty=50;
  if(player===1) score1=Math.max(0,score1-penalty);
  else if(player===2) score2=Math.max(0,score2-penalty);
  else score3=Math.max(0,score3-penalty);

  if(player===1){streak1=0;combo1=0;}
  else if(player===2){streak2=0;combo2=0;}
  else{streak3=0;combo3=0;}

  const sEl=document.getElementById(`streak${player}display`);
  if(sEl) sEl.innerText='';
  updateScore();

  const ex=ev.clientX||window.innerWidth/2;
  const ey=ev.clientY||window.innerHeight/2;
  showFloatingScore('-50점',ex,ey,'#c62828');
  makeQuestion(player);
}

function updateScore(){
  if(mode===1){
    const el=document.getElementById('score1display');
    if(el) el.innerText=score1.toLocaleString();
  } else if(mode===2){
    const e1=document.getElementById('score1display');
    const e2=document.getElementById('score2display');
    if(e1) e1.innerText=score1.toLocaleString();
    if(e2) e2.innerText=score2.toLocaleString();
  } else {
    // 3인: inline scores
    const i1=document.getElementById('inlineScore1');
    const i2=document.getElementById('inlineScore2');
    const i3=document.getElementById('inlineScore3');
    if(i1) i1.innerText=score1.toLocaleString();
    if(i2) i2.innerText=score2.toLocaleString();
    if(i3) i3.innerText=score3.toLocaleString();
  }
}

/* ====================================================
   콤보 표시
==================================================== */
function showComboInZone(player, n){
  if(mode===2){
    // 2인: 고정 화면 배너
    const id=player===1?'comboP1_2p':'comboP2_2p';
    const el=document.getElementById(id);
    if(!el) return;
    el.style.display='block';
    el.innerText=`🔥 ${n} COMBO!`;
    el.style.animation='none';
    requestAnimationFrame(()=>{ el.style.animation='comboPopFixed 0.25s cubic-bezier(0.34,1.56,0.64,1)'; });
    clearTimeout(el._t);
    el._t=setTimeout(()=>{ el.style.display='none'; },1200);
  } else {
    // 1인/3인: zone 상단 comboZone
    const el=document.getElementById(`comboZone${player}`);
    if(!el) return;
    el.style.display='block';
    el.innerText=`🔥 ${n} COMBO!`;
    el.style.animation='none';
    requestAnimationFrame(()=>{ el.style.animation='comboPop 0.25s cubic-bezier(0.34,1.56,0.64,1)'; });
    clearTimeout(el._t);
    el._t=setTimeout(()=>{ el.style.display='none'; },1200);
  }
}

/* ====================================================
   깜짝 퀴즈
==================================================== */
let usedQuizIdx=[];
function getQuizQ(){
  if(usedQuizIdx.length>=bonusQuiz.length) usedQuizIdx=[];
  let idx;
  do { idx=Math.floor(Math.random()*bonusQuiz.length); } while(usedQuizIdx.includes(idx));
  usedQuizIdx.push(idx);
  return bonusQuiz[idx];
}
function showQuiz(player){
  const q=getQuizQ();
  const zones=document.querySelectorAll('.playerZone');
  let zone;
  if(player===1) zone=document.getElementById('player1zone');
  else if(player===2) zone=document.getElementById('player2zone');
  else zone=document.getElementById('player3zone');
  if(!zone) return;

  const popup=document.createElement('div');
  popup.className='quizPopup';
  const qText=q.q.replace(/\n/g,'<br>');
  popup.innerHTML=`
    <div class="quizTitle">🎁 깜짝 과학 퀴즈!</div>
    <div class="quizTitle" style="font-size:clamp(12px,1.4vw,16px);color:#aaa;margin-top:4px;font-weight:400">정답 +300점</div>
    <div class="quizQ">${qText}</div>
    <div class="quizBtns" id="qb${player}"></div>
  `;
  zone.appendChild(popup);
  sounds.bonus();
  zone.querySelectorAll('.card').forEach(c=>c.style.pointerEvents='none');

  const area=document.getElementById(`qb${player}`);
  if(q.choices.length===2) area.classList.add('two');
  q.choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='quizBtn'; btn.innerText=c;
    btn.onclick=()=>{
      if(c===q.answer){
        if(player===1) score1+=300;
        else if(player===2) score2+=300;
        else score3+=300;
        sounds.correct(); showVisualFeedback(player,true);
        const xPos=window.innerWidth*(mode===3?(player===1?.17:player===2?.5:.83):(player===1?.25:.75));
        spawnParticle('🎉',xPos,window.innerHeight/2);
      } else {
        sounds.wrong(); showVisualFeedback(player,false);
      }
      updateScore();
      popup.style.transition='0.3s'; popup.style.transform='scale(0)'; popup.style.opacity='0';
      setTimeout(()=>{
        popup.remove();
        zone.querySelectorAll('.card').forEach(c=>c.style.pointerEvents='');
      },300);
    };
    area.appendChild(btn);
  });
}

/* ====================================================
   랭킹 등급
==================================================== */
function getRank(s){
  if(s>=3000) return{label:'🏆 천재 화학자!',   bg:'#ff9800',color:'white'};
  if(s>=2000) return{label:'🥇 수석 과학자',    bg:'#ffd700',color:'#333'};
  if(s>=1200) return{label:'🥈 우수 실험가',    bg:'#9e9e9e',color:'white'};
  if(s>=600)  return{label:'🥉 초보 과학자',    bg:'#cd7f32',color:'white'};
  return       {label:'🔬 견습 실험생',          bg:'#90caf9',color:'#333'};
}

function renderLeaderboard(board, newScore, newName){
  const lb=document.getElementById('leaderboard');
  const body=document.getElementById('lbBody');
  lb.style.display='block';
  body.innerHTML='';
  const medals=['🥇','🥈','🥉'];
  const rankClasses=['gold','silver','bronze'];
  board.forEach((row,i)=>{
    const isNew=(row.score===newScore && row.name===newName);
    const div=document.createElement('div');
    div.className='lbRow';
    if(isNew) div.style.background='#fff8e1';
    const rankLabel=i<3?medals[i]:`${i+1}`;
    const modeTag=row.modeTag?`<span class="lbModeTag">${row.modeTag}</span>`:'';
    div.innerHTML=`
      <div class="lbRank ${i<3?rankClasses[i]:''}">${rankLabel}</div>
      <div class="lbName">${row.name}${modeTag}${isNew?'<span class="lbNew">NEW</span>':''}</div>
      <div class="lbScore">${row.score.toLocaleString()}점</div>
    `;
    body.appendChild(div);
  });
}

/* ====================================================
   종료
==================================================== */
function endGame(){
  sounds.end();
  document.getElementById('tensionRing').classList.remove('active');
  const rs=document.getElementById('resultScreen');
  rs.style.display='flex';

  let text='', emoji='🎉';

  if(mode===1){
    const board=addToBoard(playerName, score1, '1인');

    const accuracy=totalCorrect1+totalWrong1>0
      ?Math.round(totalCorrect1/(totalCorrect1+totalWrong1)*100):0;
    text=
      `<span style="font-size:clamp(14px,1.8vw,20px);color:#888">${playerName}의 결과</span><br>`+
      `<span style="font-size:clamp(46px,7vw,74px);color:#e53935;font-weight:900">${score1.toLocaleString()}점</span><br>`+
      `<span style="font-size:clamp(14px,1.8vw,20px);color:#555">✅ 정답 ${totalCorrect1}개 &nbsp;❌ 오답 ${totalWrong1}개 &nbsp;🎯 정확도 ${accuracy}%</span><br>`+
      `<span style="font-size:clamp(14px,1.8vw,20px);color:#555">🔥 최고 연속 정답 ${maxStreak1}개</span>`;

    const rb=document.getElementById('rankBadge');
    rb.innerText=r.label;
    rb.style.cssText=`margin-top:12px;font-size:clamp(18px,2.2vw,30px);font-weight:900;background:${r.bg};color:${r.color};padding:8px 28px;border-radius:14px;`;
    renderLeaderboard(board, score1, playerName);
  } else if(mode===2){
    let winner='🤝 무승부!';

    text=
      `<div style="display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-bottom:10px">`+
      `<div style="text-align:center">`+
        `<div style="font-size:clamp(16px,2.2vw,26px);font-weight:900;color:#e53935">🟥 ${window.p1name||'1P'}</div>`+
        `<div style="font-size:clamp(36px,5.5vw,58px);font-weight:900;color:#333">${score1.toLocaleString()}점</div>`+
        `<div style="font-size:clamp(12px,1.4vw,16px);color:#666">✅${totalCorrect1} ❌${totalWrong1} 🎯${acc1}%</div>`+
      `</div>`+
      `<div style="display:flex;align-items:center;font-size:36px">VS</div>`+
      `<div style="text-align:center">`+

        `<div style="font-size:clamp(36px,5.5vw,58px);font-weight:900;color:#333">${score2.toLocaleString()}점</div>`+
        `<div style="font-size:clamp(12px,1.4vw,16px);color:#666">✅${totalCorrect2} ❌${totalWrong2} 🎯${acc2}%</div>`+

      `</div>`+
